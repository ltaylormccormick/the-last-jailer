name: Android build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Validate release build and unit tests (unsigned)
        run: ./gradlew bundleRelease testReleaseUnitTest --stacktrace
      - name: Validate upload signing with a disposable test key
        run: python3 scripts/test-play-signing.py
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: the-last-jailer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: the-last-jailer-test-results
          path: app/build/reports/tests/testDebugUnitTest

name: Android build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Guard the GitHub Pages folder
        # docs/ is published publicly by GitHub Pages (main, /docs). Only the privacy policy (its URL is
        # listed on the Play page) and .nojekyll may live there; internal notes must never be added.
        run: |
          set -eu
          unexpected=$(find docs -type f ! -name privacy-policy.html ! -name .nojekyll)
          if [ -n "$unexpected" ]; then
            echo "::error::docs/ is published by GitHub Pages and may only contain privacy-policy.html and .nojekyll. Unexpected files:"
            echo "$unexpected"
            exit 1
          fi
          test -f docs/privacy-policy.html || { echo "::error::docs/privacy-policy.html is missing (the Play privacy-policy URL would break)"; exit 1; }
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Validate release build and unit tests (unsigned)
        run: ./gradlew bundleRelease testReleaseUnitTest --stacktrace
      - name: Validate internal tester bundle and entitlement tests
        run: ./gradlew bundleInternalTest testInternalTestUnitTest --stacktrace
      - name: Validate upload signing with a disposable test key
        run: python3 scripts/test-play-signing.py
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: the-last-jailer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: the-last-jailer-test-results
          path: app/build/reports/tests/testDebugUnitTest

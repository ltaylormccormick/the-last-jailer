name: O4 Emulator Spike

# O4 Stage 2 - FEASIBILITY SPIKE, plus Stage 3 launch-and-observe. Stage 2 proves (or fails to prove) four plain things
# on a GitHub-hosted Android emulator:
#   1. an emulator boots in GitHub Actions;
#   2. the three reviewed O4 builds (built here, in this one job, with one temporary debug key) install over each other
#      in the order OLD-A -> OLD-B -> NEW without clearing app data;
#   3. "adb run-as" can reach the QA app's private storage;
#   4. a harness marker written to that storage survives each update.
# Stage 3 (only after every Stage 2 check passes) launches the NEW debug app WITHOUT sending any input, waits for it to
# reach a healthy foreground, checks it stays up, looks for the six navigation labels in a UI dump, scans this package's
# crash/ANR events, and inspects private storage by file NAMES and SIZES only (the one file whose content is read is the
# Stage 2 harness marker). It never taps, never commits a story choice, never takes a screenshot, never uploads anything.
# Neither stage proves ANYTHING about checkpoint stamps, lineage, stale-history rejection or interrupted-write
# recovery: no game state is created or read. Launching the app alone writes no save.
#
# Same Stage 1 safeguards as o4-qa-apks.yml: fixed commits that must be on main, read-only token, no secrets, fresh-key
# guard (self-tested), exactly one signer shared by all three APKs, package/versionCode/debuggable checks.
# Unlike Stage 1 nothing is uploaded: no APK, no key, no storage contents. Results are written as annotations and the
# job summary. The emulator is started with the Android SDK tools already on the runner (no third-party action).
# Only the QA package com.thelastjailer.app.debug is ever touched.

on:
  pull_request:
    paths:
      - '.github/workflows/o4-emulator-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OLD_A_SHA: 3127d2a04115e1992d2c64b32396d27e6da3df12   # Batch 1: safety foundations (#117)
      OLD_B_SHA: 4755ae45610371f82e26f80d455abd392f52eebe   # Batch 2C-1b-1: confirm before SAVE replaces a slot (#124)
      NEW_SHA: 071439fc1145a4df21fc844492639ac82e48e6c6     # O3-B: slot state stamp (#125)
      EXPECTED_PACKAGE: com.thelastjailer.app.debug
    steps:
      - name: Checkout OLD-A
        uses: actions/checkout@v7
        with:
          ref: ${{ env.OLD_A_SHA }}
          path: src/OLD-A
          persist-credentials: false
      - name: Checkout OLD-B
        uses: actions/checkout@v7
        with:
          ref: ${{ env.OLD_B_SHA }}
          path: src/OLD-B
          persist-credentials: false
      - name: Checkout NEW
        uses: actions/checkout@v7
        with:
          ref: ${{ env.NEW_SHA }}
          path: src/NEW
          persist-credentials: false

      - name: Confirm the exact commits (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in "OLD-A:$OLD_A_SHA" "OLD-B:$OLD_B_SHA" "NEW:$NEW_SHA"; do
            label="${pair%%:*}"; want="${pair#*:}"
            case "$want" in
              *[!0-9a-f]*|"") echo "::error::$label commit id is not lowercase hex"; exit 1 ;;
            esac
            [ "${#want}" -eq 40 ] || { echo "::error::$label commit id is not 40 characters"; exit 1; }
            got="$(git -C "src/$label" rev-parse HEAD)"
            if [ "$got" != "$want" ]; then
              echo "::error::$label checked out $got, expected $want"; exit 1
            fi
            # The commit must be part of main's history ("ahead" = main is ahead of it, "identical" = it is main).
            status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${want}...main" --jq .status)"
            case "$status" in
              ahead|identical) echo "$label $want is on main ($status)" ;;
              *) echo "::error::$label $want is not an ancestor of main (compare status: $status)"; exit 1 ;;
            esac
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write the fresh-key guard
        run: |
          cat > "$RUNNER_TEMP/fresh-key-guard.sh" <<'GUARD'
          #!/bin/bash
          # Fails if ANY debug keystore already exists where the Android build tools would look for one.
          # The QA builds must use a key created on this runner during this job, so the guard must pass
          # BEFORE the first build. The three builds then share the key the first build creates.
          set -u
          found=""
          for d in "${ANDROID_USER_HOME:-}" "${ANDROID_SDK_HOME:-}/.android" "${HOME:-}/.android"; do
            case "$d" in ""|"/.android") continue ;; esac
            if [ -e "$d/debug.keystore" ]; then found="$found $d/debug.keystore"; fi
          done
          if [ -n "$found" ]; then
            echo "::error title=Debug key pre-existed::A debug keystore already exists on this runner:$found. The QA builds must use a fresh key."
            exit 1
          fi
          echo "no pre-existing debug keystore"
          GUARD
          chmod +x "$RUNNER_TEMP/fresh-key-guard.sh"
      - name: Self-test the fresh-key guard
        run: |
          set -u
          guard="$RUNNER_TEMP/fresh-key-guard.sh"
          t="$(mktemp -d)"
          mkdir -p "$t/clean" "$t/dirty/.android" "$t/custom"
          : > "$t/dirty/.android/debug.keystore"
          : > "$t/custom/debug.keystore"
          env -u ANDROID_USER_HOME -u ANDROID_SDK_HOME HOME="$t/clean" "$guard" >/dev/null \
            || { echo "::error::guard self-test: a clean home was wrongly rejected"; exit 1; }
          if env -u ANDROID_USER_HOME -u ANDROID_SDK_HOME HOME="$t/dirty" "$guard" >/dev/null 2>&1; then
            echo "::error::guard self-test: a pre-existing ~/.android/debug.keystore was NOT rejected"; exit 1
          fi
          if env -u ANDROID_SDK_HOME HOME="$t/clean" ANDROID_USER_HOME="$t/custom" "$guard" >/dev/null 2>&1; then
            echo "::error::guard self-test: a pre-existing keystore in ANDROID_USER_HOME was NOT rejected"; exit 1
          fi
          rm -rf "$t"
          echo "guard self-test passed: clean home accepted, both pre-existing-key cases rejected"
      - name: Require a fresh runner (no pre-existing debug key)
        run: '"$RUNNER_TEMP/fresh-key-guard.sh"'

      - name: Build the three debug APKs in one job
        run: |
          set -euo pipefail
          mkdir -p qa-apks
          for label in OLD-A OLD-B NEW; do
            echo "::group::assembleDebug $label"
            (cd "src/$label" && ./gradlew assembleDebug --stacktrace)
            echo "::endgroup::"
            cp "src/$label/app/build/outputs/apk/debug/app-debug.apk" "qa-apks/$label.apk"
          done
          ls -l qa-apks

      - name: Verify the APKs, then write the manifest (fail closed)
        run: |
          set -euo pipefail
          QA_DIR="${QA_DIR:-qa-apks}"
          BT="${QA_BUILD_TOOLS:-}"
          if [ -z "$BT" ]; then
            root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools"
            [ -d "$root" ] || { echo "::error::Android build-tools folder not found"; exit 1; }
            BT="$root/$(ls "$root" | sort -V | tail -1)"
          fi
          AAPT2="$BT/aapt2"; APKSIGNER="$BT/apksigner"
          [ -x "$AAPT2" ] && [ -x "$APKSIGNER" ] || { echo "::error::aapt2 or apksigner missing in $BT"; exit 1; }

          fail=0
          problem() { echo "::error::$*"; fail=1; }
          declare -A COMMIT=( [OLD-A]="$OLD_A_SHA" [OLD-B]="$OLD_B_SHA" [NEW]="$NEW_SHA" )
          declare -A FP SHA BYTES VCODE VNAME PKG LABELTXT
          for label in OLD-A OLD-B NEW; do
            apk="$QA_DIR/$label.apk"
            if [ ! -s "$apk" ]; then problem "$label: $apk is missing or empty"; continue; fi
            SHA[$label]="$(sha256sum "$apk" | cut -d' ' -f1)"
            BYTES[$label]="$(stat -c %s "$apk")"
            badging="$("$AAPT2" dump badging "$apk" 2>/dev/null || true)"
            PKG[$label]="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$badging" | head -n1)"
            VCODE[$label]="$(sed -n "s/^package: .* versionCode='\([^']*\)'.*/\1/p" <<<"$badging" | head -n1)"
            VNAME[$label]="$(sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p" <<<"$badging" | head -n1)"
            LABELTXT[$label]="$(sed -n "s/^application-label:'\(.*\)'$/\1/p" <<<"$badging" | head -n1)"
            [ "${PKG[$label]}" = "$EXPECTED_PACKAGE" ] || problem "$label: package is '${PKG[$label]}', expected $EXPECTED_PACKAGE"
            [ "${VCODE[$label]}" = "1" ] || problem "$label: versionCode is '${VCODE[$label]}', expected 1"
            grep -q '^application-debuggable' <<<"$badging" || problem "$label: not a debuggable build"
            if certs="$("$APKSIGNER" verify --print-certs -v "$apk" 2>&1)"; then
              # Public information only: certificate subject and SHA-256 fingerprints, never key material.
              echo "::group::apksigner output for $label"
              echo "$certs"
              echo "::endgroup::"
              # Also as an annotation, so the exact format can be read without downloading logs.
              echo "::notice title=apksigner $label::${certs//$'\n'/%0A}"
              # apksigner words this differently across versions: "Signer #1 certificate SHA-256 digest: <hex>" or,
              # as seen on the GitHub runner, "V2 Signer: certificate SHA-256 digest: <hex>" (V3 forms exist too).
              # Any hex case. Several schemes repeat the same digest, so the digests are de-duplicated.
              digests="$(sed -n 's/^\(Signer\|V[0-9.]* Signer\)[^:]*:\{0,1\} certificate SHA-256 digest: *\([0-9A-Fa-f]*\) *$/\2/p' <<<"$certs" | tr 'A-F' 'a-f' | sort -u)"
              n="$(grep -c . <<<"$digests" || true)"
              signers="$(sed -n 's/^Number of signers: *\([0-9]*\) *$/\1/p' <<<"$certs" | head -n1)"
              if [ -n "$signers" ] && [ "$signers" != "1" ]; then
                problem "$label: apksigner reports $signers signers, expected 1"
              fi
              if [ "$n" = "1" ]; then
                FP[$label]="$digests"
              else
                problem "$label: expected exactly 1 distinct signer certificate, found $n"
                FP[$label]=""
              fi
            else
              echo "$certs"
              problem "$label: apksigner could not verify the signature"
              FP[$label]=""
            fi
          done

          if [ "$fail" -eq 0 ]; then
            [ "${FP[OLD-A]}" = "${FP[OLD-B]}" ] && [ "${FP[OLD-B]}" = "${FP[NEW]}" ] \
              || problem "the three APKs are NOT signed by the same certificate"
            if [ "${SHA[OLD-A]}" = "${SHA[OLD-B]}" ] || [ "${SHA[OLD-B]}" = "${SHA[NEW]}" ] || [ "${SHA[OLD-A]}" = "${SHA[NEW]}" ]; then
              problem "two APKs are byte-identical, so they are not three different builds"
            fi
          fi

          # Nothing but the three APKs and the manifest may ever be uploaded (no key material, no extras).
          unexpected="$(cd "$QA_DIR" && find . -type f ! -name OLD-A.apk ! -name OLD-B.apk ! -name NEW.apk ! -name MANIFEST.txt | sort)"
          [ -z "$unexpected" ] || problem "unexpected files in $QA_DIR: $unexpected"

          if [ "$fail" -ne 0 ]; then echo "Verification FAILED; nothing will be uploaded."; exit 1; fi

          {
            echo "The Last Jailer - O4 QA APK set"
            echo "workflow run: ${GITHUB_RUN_ID:-local} (attempt ${GITHUB_RUN_ATTEMPT:-1})"
            echo "workflow commit: ${GITHUB_SHA:-local}"
            echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "expected package: $EXPECTED_PACKAGE"
            echo "signing: one temporary debug key created on this runner; the key is not stored or uploaded"
            echo
            for label in OLD-A OLD-B NEW; do
              echo "$label.apk"
              echo "  commit:       ${COMMIT[$label]}"
              echo "  bytes:        ${BYTES[$label]}"
              echo "  sha256:       ${SHA[$label]}"
              echo "  package:      ${PKG[$label]}"
              echo "  versionCode:  ${VCODE[$label]}"
              echo "  versionName:  ${VNAME[$label]}"
              echo "  app label:    ${LABELTXT[$label]}"
              echo "  signer sha256 ${FP[$label]}"
            done
            echo
            echo "All three APKs have the same signer certificate: ${FP[NEW]}"
          } > "$QA_DIR/MANIFEST.txt"
          cat "$QA_DIR/MANIFEST.txt"
          # The same content as annotations (public information only), so the result is readable without downloading logs.
          echo "::notice title=MANIFEST.txt::$(sed ':a;N;$!ba;s/\n/%0A/g' "$QA_DIR/MANIFEST.txt")"
          echo "::notice title=APK folder::$(cd "$QA_DIR" && find . -type f -printf '%P (%s bytes)\n' | sort | paste -sd ';' -)"

          for label in OLD-A OLD-B NEW; do
            echo "::notice title=O4 $label::commit=${COMMIT[$label]} sha256=${SHA[$label]} signer=${FP[$label]} package=${PKG[$label]} versionCode=${VCODE[$label]} label='${LABELTXT[$label]}'"
          done
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### O4 QA APK set (fingerprints and hashes only)"
              echo
              echo "| Build | Commit | APK SHA-256 | Signer SHA-256 |"
              echo "|---|---|---|---|"
              for label in OLD-A OLD-B NEW; do
                echo "| $label | \`${COMMIT[$label]:0:7}\` | \`${SHA[$label]}\` | \`${FP[$label]}\` |"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write the device checks
        run: |
          cat > "$RUNNER_TEMP/device-checks.sh" <<'DEVCHECKS'
          #!/bin/bash
          # O4 Stage 2 emulator spike: device checks.
          # Installs the three QA builds over each other (never uninstall, never clear data, never launch the app, no gameplay)
          # and proves what can honestly be proven about install and private-storage access.
          # The ONLY write to the app's private storage is one harness marker file (files/o4-spike-marker.txt) holding a random
          # value. It is not a game save. Nothing read from the app's storage is printed except file NAMES and that marker's
          # first 8 characters.
          set -u
          PKG="${EXPECTED_PACKAGE:?EXPECTED_PACKAGE is required}"
          QA_DIR="${QA_DIR:-qa-apks}"
          ADB="${ADB:-adb}"
          OUT="${RESULTS_FILE:?RESULTS_FILE is required}"
          MARKER_FILE="files/o4-spike-marker.txt"
          fails=0
          rec() { # status id detail
            printf '%s %s: %s\n' "$1" "$2" "$3" | tee -a "$OUT"
            if [ "$1" = FAIL ]; then fails=$((fails + 1)); fi
            return 0
          }
          # One shell command string, run on the device; remote exit status is passed back.
          dsh() { local o rc; o="$("$ADB" shell "$1" 2>&1)"; rc=$?; printf '%s\n' "$o" | tr -d '\r'; return "$rc"; }
          field() { # dumpsys package field, e.g. firstInstallTime
            dsh "dumpsys package $PKG" | sed -n "s/^ *$1=\(.*\)$/\1/p" | head -n1
          }
          installed_sha() {
            local p
            p="$(dsh "pm path $PKG" | sed -n 's/^package://p' | grep '/base\.apk$' | head -n1)"
            [ -n "$p" ] || return 1
            dsh "sha256sum $p" | cut -d' ' -f1
          }

          # ---- E1: the device is an emulator and has finished booting
          sdk="$(dsh 'getprop ro.build.version.sdk')"; abi="$(dsh 'getprop ro.product.cpu.abi')"
          qemu="$(dsh 'getprop ro.kernel.qemu')"; boot="$(dsh 'getprop sys.boot_completed')"
          if [ "$boot" = 1 ]; then rec PASS E1 "emulator booted (api=$sdk abi=$abi qemu=$qemu)"; else rec FAIL E1 "boot not completed (sys.boot_completed='$boot')"; fi

          # ---- E2: starting point. Nothing of ours installed; the Play package is never touched either way.
          pkgs="$(dsh 'pm list packages')"
          if grep -qx "package:$PKG" <<<"$pkgs"; then rec FAIL E2 "$PKG is already installed on this emulator"; else rec PASS E2 "$PKG not installed before the first install"; fi
          if grep -qx "package:com.thelastjailer.app" <<<"$pkgs"; then rec INFO E2b "the Play package is present on this emulator; it is never touched"; else rec PASS E2b "the Play package com.thelastjailer.app is not on this emulator"; fi

          nonce="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          first_install=""; prev_update=""
          i=0
          for label in OLD-A OLD-B NEW; do
            i=$((i + 1)); apk="$QA_DIR/$label.apk"
            if [ ! -s "$apk" ]; then rec FAIL "I$i" "$label: $apk missing"; continue; fi
            want="$(sha256sum "$apk" | cut -d' ' -f1)"
            if [ "$i" -eq 1 ]; then flag=""; else flag="-r"; fi
            # ---- I<n>: install. -r keeps data. Never -d, never uninstall, never pm clear.
            inst="$("$ADB" install $flag "$apk" 2>&1)"; rc=$?
            if [ "$rc" -eq 0 ] && grep -q '^Success' <<<"$inst"; then rec PASS "I$i" "$label installed (adb install${flag:+ $flag}: Success)"; else rec FAIL "I$i" "$label install failed (rc=$rc): $(tr -d '\r' <<<"$inst" | tail -n 2 | paste -sd ' ' -)"; continue; fi
            # ---- V<n>: what Android says is installed
            vc="$(field versionCode | sed 's/ .*//')"
            if [ "$vc" = 1 ]; then rec PASS "V$i" "$label: Android reports versionCode=1"; else rec FAIL "V$i" "$label: versionCode='$vc'"; fi
            if dsh "dumpsys package $PKG" | grep -q 'DEBUGGABLE'; then rec PASS "D$i" "$label: package is DEBUGGABLE"; else rec FAIL "D$i" "$label: package is not DEBUGGABLE"; fi
            got="$(installed_sha || true)"
            if [ -z "$got" ]; then rec INCONCLUSIVE "H$i" "$label: could not read the installed base.apk hash"
            elif [ "$got" = "$want" ]; then rec PASS "H$i" "$label: installed base.apk SHA-256 equals the built $label.apk (${want:0:12})"
            else rec FAIL "H$i" "$label: installed base.apk (${got:0:12}) differs from the built $label.apk (${want:0:12})"; fi
            # ---- F<n>: an update, not a reinstall
            fit="$(field firstInstallTime)"; lut="$(field lastUpdateTime)"
            if [ "$i" -eq 1 ]; then
              first_install="$fit"; rec INFO "F$i" "firstInstallTime recorded"
            else
              if [ -n "$fit" ] && [ "$fit" = "$first_install" ]; then rec PASS "F$i" "$label: firstInstallTime unchanged, so this was an in-place update"; else rec FAIL "F$i" "$label: firstInstallTime changed ('$first_install' -> '$fit'), so the app was reinstalled"; fi
              if [ "$lut" != "$prev_update" ]; then rec PASS "U$i" "$label: lastUpdateTime moved forward"; else rec INFO "U$i" "$label: lastUpdateTime has the same value as before (one-second clock resolution)"; fi
            fi
            prev_update="$lut"
            # ---- R<n>: run-as can reach the app's private storage
            uidline="$(dsh "run-as $PKG id" || true)"
            if grep -q '^uid=' <<<"$uidline"; then rec PASS "R$i" "$label: run-as works (${uidline%% *})"; else rec FAIL "R$i" "$label: run-as failed: $(head -n 1 <<<"$uidline")"; fi
            names="$(dsh "run-as $PKG ls -1" | paste -sd ',' -)"
            rec INFO "L$i" "$label: top-level entries in the app data dir (names only): ${names:-none}"
            # ---- M<n>: the harness marker proves private data survives each update
            if [ "$i" -eq 1 ]; then
              if dsh "run-as $PKG sh -c 'mkdir -p files && echo $nonce > $MARKER_FILE'" >/dev/null; then rec PASS "M$i" "$label: wrote harness marker ${nonce:0:8}... (not a game save)"; else rec FAIL "M$i" "$label: could not write the harness marker"; fi
            else
              back="$(dsh "run-as $PKG cat $MARKER_FILE" || true)"
              if [ "$back" = "$nonce" ]; then rec PASS "M$i" "$label: harness marker ${nonce:0:8}... still present, so app data survived the update"; else rec FAIL "M$i" "$label: harness marker missing or changed"; fi
            fi
          done

          pass="$(grep -c '^PASS ' "$OUT" || true)"
          rec RESULT SUMMARY "$pass passed, $fails failed (INFO/INCONCLUSIVE lines are not passes)"
          [ "$fails" -eq 0 ]
          DEVCHECKS
          chmod +x "$RUNNER_TEMP/device-checks.sh"
          bash -n "$RUNNER_TEMP/device-checks.sh"

      - name: Write the launch checks
        run: |
          cat > "$RUNNER_TEMP/launch-observe.sh" <<'LAUNCHCHECKS'
          #!/bin/bash
          # O4 Stage 3: launch the NEW debug app on the emulator and observe it. Runs only after the Stage 2 device checks pass.
          # SENDS NO INPUT (no taps, keys or text), so no choice is ever committed and no save can be written by this script.
          # Only the QA package is touched. Private storage is inspected by file NAMES and SIZES only; the one file whose
          # content is read is the Stage 2 harness marker. Nothing is uploaded and no screenshot is taken.
          # Outcomes: PASS / FAIL / INCONCLUSIVE. INCONCLUSIVE is never counted as a pass and makes the script exit non-zero.
          set -u
          set +e   # never abort on a failed probe; every failure is recorded explicitly and decides the exit code
          PKG="${EXPECTED_PACKAGE:?EXPECTED_PACKAGE is required}"
          ADB="${ADB:-adb}"
          OUT="${RESULTS_FILE:?RESULTS_FILE is required}"
          ACT="com.thelastjailer.app.MainActivity"
          COMP="$PKG/$ACT"
          POLL="${O4_POLL_SECS:-2}"                 # seconds between polls
          HEALTHY_TRIES="${O4_HEALTHY_TRIES:-30}"   # 30 x 2 s = up to 60 s to reach a healthy foreground
          SOAK_POLLS="${O4_SOAK_POLLS:-8}"          # 8 x 2 s = about 15 s of stability
          MARKER_FILE="files/o4-spike-marker.txt"
          LABELS="Story Character Inventory Map Save Options"
          passes=0; fails=0; incs=0
          t_start=$SECONDS
          secs() { awk -v a="$1" -v b="$2" 'BEGIN { printf "%g", a * b }'; }   # display math that cannot abort a record
          rec() { # status id detail
            printf '%s %s: %s\n' "$1" "$2" "$3" | tee -a "$OUT"
            case "$1" in PASS) passes=$((passes + 1)) ;; FAIL) fails=$((fails + 1)) ;; INCONCLUSIVE) incs=$((incs + 1)) ;; esac
            return 0
          }
          dsh() { local o rc; o="$(timeout 60 "$ADB" shell "$1" 2>&1)"; rc=$?; printf '%s\n' "$o" | tr -d '\r'; return "$rc"; }
          names() { # comma-separated entry names of an app-private folder, or (absent)
            local o; if o="$(dsh "run-as $PKG ls -1 $1")"; then printf '%s' "$o" | paste -sd ',' -; else printf '(absent)'; fi
          }
          sizes() { # "name bytes" for plain files under shared_prefs and files; sizes only, never contents
            dsh "run-as $PKG sh -c 'for f in shared_prefs/* files/*; do [ -f \"\$f\" ] && stat -c \"%n %s\" \"\$f\"; done'" | grep -v '^$' | paste -sd ';' -
          }
          foreground_ok() { # $1 = text from window/activity dumps
            grep -q "$PKG/.*MainActivity" <<<"$1" && ! grep -qiE 'Application Error|Application Not Responding|isn.t responding|has stopped' <<<"$1"
          }
          look() { # prints "<pid>|<focus lines>" for one poll
            local p f
            p="$(dsh "pidof $PKG" | head -n1)"
            f="$(dsh "dumpsys window | grep -E 'mCurrentFocus|mFocusedApp'; dumpsys activity activities | grep -E 'topResumedActivity'" | head -n 4 | paste -sd ' ' -)"
            printf '%s|%s' "$p" "$f"
          }

          # ---- X1: fresh-launch precondition and the "before" picture
          pid0="$(dsh "pidof $PKG" | head -n1)"
          if [ -z "$pid0" ]; then rec PASS X1 "the app is not running before launch (so a running process afterwards is a fresh launch)"; else rec FAIL X1 "the app is already running (pid $pid0) before launch, so this would not be a fresh launch"; fi
          pre_marker="$(dsh "run-as $PKG cat $MARKER_FILE" || true)"
          if [ -n "$pre_marker" ]; then rec PASS X1b "the Stage 2 harness marker ${pre_marker:0:8}... is present before launch"; else rec FAIL X1b "the harness marker is missing before launch"; fi
          pre_top="$(names .)"; pre_prefs="$(names shared_prefs)"; pre_files="$(names files)"

          # ---- X2: launch. Everything from here on is the launch window (logcat is emptied first).
          timeout 30 "$ADB" logcat -b all -c >/dev/null 2>&1
          t_launch=$SECONDS
          am_out="$(timeout 90 "$ADB" shell "am start -W -n $COMP" 2>&1)"; am_rc=$?
          am_out="$(tr -d '\r' <<<"$am_out")"
          lstate="$(sed -n 's/^LaunchState: *//p' <<<"$am_out" | head -n1)"
          ltotal="$(sed -n 's/^TotalTime: *//p' <<<"$am_out" | head -n1)"
          if [ "$am_rc" -eq 0 ] && grep -q '^Status: ok' <<<"$am_out" && ! grep -q '^Error' <<<"$am_out"; then
            rec PASS X2 "am start -W reported Status ok (LaunchState=${lstate:-not reported}, TotalTime=${ltotal:-?} ms)"
          else
            rec FAIL X2 "am start did not report success (rc=$am_rc): $(grep -E '^(Error|Status|Warning)' <<<"$am_out" | head -n 3 | paste -sd ' ' - | cut -c1-200)"
          fi

          # ---- X3: reaches a healthy foreground: a process exists and our MainActivity has focus, no error dialog
          healthy=no; pid=""; focus=""; t_healthy=""
          for _ in $(seq 1 "$HEALTHY_TRIES"); do
            r="$(look)"; pid="${r%%|*}"; focus="${r#*|}"
            if [ -n "$pid" ] && foreground_ok "$focus"; then healthy=yes; t_healthy=$((SECONDS - t_launch)); break; fi
            sleep "$POLL"
          done
          if [ "$healthy" = yes ]; then
            fresh="a new process (pid $pid)"; [ -n "$pid0" ] && [ "$pid0" = "$pid" ] && fresh="the SAME process as before launch (pid $pid)"
            rec PASS X3 "$PKG/$ACT is in the foreground after about ${t_healthy}s; $fresh"
            if [ -n "$lstate" ] && [ "$lstate" != COLD ]; then rec INFO X3b "LaunchState was $lstate, not COLD; freshness rests on X1 and the new pid"; fi
          else
            rec FAIL X3 "never reached a healthy foreground within $(secs "$HEALTHY_TRIES" "$POLL")s (pid='${pid:-none}', focus='$(cut -c1-160 <<<"$focus")')"
          fi

          # ---- X4: stays healthy: same process, same focus, no restart, for the whole soak
          if [ "$healthy" = yes ]; then
            pid_start="$pid"; stable=yes; why=""
            for _ in $(seq 1 "$SOAK_POLLS"); do
              sleep "$POLL"
              r="$(look)"; p="${r%%|*}"; f="${r#*|}"
              if [ "$p" != "$pid_start" ]; then stable=no; why="pid changed or vanished ('$pid_start' -> '${p:-none}')"; break; fi
              if ! foreground_ok "$f"; then stable=no; why="focus no longer ours: $(cut -c1-160 <<<"$f")"; break; fi
            done
            if [ "$stable" = yes ]; then rec PASS X4 "stable for about $(secs "$SOAK_POLLS" "$POLL")s: same pid $pid_start, our activity kept the foreground"; else rec FAIL X4 "not stable: $why"; fi
          else
            pid_start=""; rec INCONCLUSIVE X4 "stability not assessed because the app never reached a healthy foreground (see X3)"
          fi

          # ---- X5: crash / ANR / process death for THIS package in THIS launch window (logcat was emptied at launch)
          if ! dsh "logcat -d -b crash -t 1" >/dev/null; then
            rec INCONCLUSIVE X5 "logcat could not be read, so crashes were not checked"
          else
            bad=""
            if [ -n "$pid_start" ]; then bad="$bad$(dsh "logcat -d -b main,crash --pid=$pid_start" | grep -E 'FATAL EXCEPTION' | head -n 2)"$'\n'; fi
            bad="$bad$(dsh "logcat -d -b crash" | grep -F "$PKG" | head -n 2)"$'\n'
            bad="$bad$(dsh "logcat -d -b events" | grep -E 'am_crash|am_anr|am_proc_died' | grep -F "$PKG" | head -n 2)"$'\n'
            bad="$bad$(dsh "logcat -d -b system,main" | grep -E "ANR in $PKG|Process $PKG .*has died" | head -n 2)"
            bad="$(grep -v '^$' <<<"$bad" | head -n 4 | cut -c1-200 | paste -sd '|' -)"
            if [ -z "$bad" ]; then rec PASS X5 "no crash, ANR or process-death event for $PKG during the launch window"; else rec FAIL X5 "relevant event(s): $bad"; fi
          fi

          # ---- X6: initial UI. Bounded dump retries; a dump that cannot be read is INCONCLUSIVE, never a pass.
          dumped=no; dump_note=""
          for a in 1 2 3; do
            o="$(dsh "uiautomator dump /sdcard/o4-window.xml")"; rc=$?
            if [ "$rc" -eq 0 ] && grep -qi 'dumped to' <<<"$o"; then dumped=yes; break; fi
            dump_note="attempt $a: $(head -n 1 <<<"$o" | cut -c1-120)"; sleep 3
          done
          if [ "$dumped" != yes ]; then
            rec INCONCLUSIVE X6 "the UI hierarchy could not be dumped after 3 attempts ($dump_note); process and focus checks above still stand"
          else
            xml="$(dsh "cat /sdcard/o4-window.xml")"; dsh "rm -f /sdcard/o4-window.xml" >/dev/null
            app_xml="$(grep -oE "<node [^>]*package=\"$PKG\"[^>]*>" <<<"$xml")"
            app_nodes="$(grep -c . <<<"$app_xml")"; [ -n "$app_xml" ] || app_nodes=0
            found=""; missing=""
            for l in $LABELS; do if grep -Eq "(text|content-desc)=\"$l\"" <<<"$app_xml"; then found="$found $l"; else missing="$missing $l"; fi; done
            nfound="$(wc -w <<<"$found")"
            sample="$(grep -oE "(text|content-desc)=\"[^\"]{1,40}\"" <<<"$app_xml" | sort -u | head -n 12 | paste -sd ' ' -)"
            if [ "$nfound" -eq 6 ]; then
              rec PASS X6 "all six navigation labels are present in the UI dump ($app_nodes nodes from the app)"
            elif [ "$app_nodes" -eq 0 ]; then
              rec INCONCLUSIVE X6 "the UI dump contained no nodes from $PKG, so the labels could not be assessed"
            elif [ "$nfound" -eq 0 ]; then
              rec INCONCLUSIVE X6 "$app_nodes app nodes but none of the six labels were recognised; this may be how the dump represents them. Strings seen: $sample"
            else
              rec FAIL X6 "partial UI: found [$found ] missing [$missing ] ($app_nodes app nodes). Strings seen: $sample"
            fi
          fi

          # ---- X7: private storage after launch. Names and sizes only.
          post_top="$(names .)"; post_prefs="$(names shared_prefs)"; post_files="$(names files)"
          unexpected="$(tr ',' '\n' <<<"$post_top,$post_prefs,$post_files" | grep -E '^jailer_(saves|ckpt_)' | paste -sd ',' -)"
          if [ -z "$unexpected" ]; then rec PASS X7 "no jailer_saves* or jailer_ckpt_* file exists after launch"; else rec FAIL X7 "unexpected save/checkpoint file(s) after launch: $unexpected"; fi
          rec INFO X7b "private storage, names only. before: top=[$pre_top] shared_prefs=[$pre_prefs] files=[$pre_files]; after: top=[$post_top] shared_prefs=[$post_prefs] files=[$post_files]"
          rec INFO X7c "file sizes in bytes (shared_prefs and files): $(sizes)"
          post_marker="$(dsh "run-as $PKG cat $MARKER_FILE" || true)"
          if [ -n "$pre_marker" ] && [ "$post_marker" = "$pre_marker" ]; then rec PASS X8 "the harness marker is unchanged after launch"; else rec FAIL X8 "the harness marker changed or disappeared during launch"; fi

          rec INFO X9 "stage 3 took $((SECONDS - t_start))s; launch to healthy foreground: ${t_healthy:-n/a}s"
          rec RESULT STAGE3 "$passes passed, $fails failed, $incs inconclusive (INFO lines are not passes; inconclusive is not a pass)"
          if [ "$fails" -gt 0 ]; then exit 1; fi
          if [ "$incs" -gt 0 ]; then exit 3; fi
          exit 0
          LAUNCHCHECKS
          chmod +x "$RUNNER_TEMP/launch-observe.sh"
          bash -n "$RUNNER_TEMP/launch-observe.sh"

      - name: Enable KVM acceleration (fail closed)
        run: |
          set -eu
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -e /dev/kvm ]; then
            echo "::error title=No KVM::/dev/kvm is not available on this runner, so the emulator cannot run with acceleration."
            echo "FAIL E0: /dev/kvm not available on this runner; emulator not started" > "$RUNNER_TEMP/o4-spike-results.txt"
            exit 1
          fi
          ls -l /dev/kvm

      - name: Install the emulator and a system image
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || { echo "::error::sdkmanager not found at $SM"; echo "FAIL E0: sdkmanager not found" > "$RUNNER_TEMP/o4-spike-results.txt"; exit 1; }
          "$SM" --licenses < <(yes) > "$RUNNER_TEMP/sdk-licenses.log" 2>&1 || true
          if ! "$SM" --install "platform-tools" "emulator" "system-images;android-34;default;x86_64" > "$RUNNER_TEMP/sdkmanager.log" 2>&1; then
            tail -n 40 "$RUNNER_TEMP/sdkmanager.log"
            echo "FAIL E0: sdkmanager could not install the emulator or system image" > "$RUNNER_TEMP/o4-spike-results.txt"
            exit 1
          fi
          tail -n 5 "$RUNNER_TEMP/sdkmanager.log"

      - name: Install libpulse0 and verify the emulator can start (fail closed)
        run: |
          set -uo pipefail
          set +e   # the runner starts steps with bash -e; every failure here is handled explicitly and still exits non-zero
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          RES="$RUNNER_TEMP/o4-spike-results.txt"
          ann() { # level title ; message on stdin
            local m; m="$(head -c 3500 | tr -d '\r' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            echo "::$1 title=$2::$m"
          }
          stop() { echo "FAIL E0: $1" > "$RES"; echo "::error title=Emulator library check::$1"; exit 1; }
          # The emulator's QEMU binary needs libpulse.so.0 even with audio off; the runner image does not ship it.
          # This installs exactly one package, libpulse0, and nothing else.
          sudo apt-get update -qq > "$RUNNER_TEMP/apt-update.log" 2>&1
          sudo apt-get install -y --no-install-recommends libpulse0 > "$RUNNER_TEMP/apt-install.log" 2>&1
          apt_rc=$?
          if [ "$apt_rc" -ne 0 ]; then tail -n 15 "$RUNNER_TEMP/apt-install.log" | cut -c1-300 | ann notice "apt install libpulse0 output"; stop "apt-get install libpulse0 failed (exit code $apt_rc)"; fi
          pkgver="$(dpkg-query -W -f='${Package} ${Version}' libpulse0 2>&1)"
          soname="$(ldconfig -p 2>&1 | grep 'libpulse\.so\.0' | head -n 2 | paste -sd ';' -)"
          ver_full="$(timeout 30 "$SDK/emulator/emulator" -version 2>&1)"
          ver_rc=$?
          ver_out="$(head -n 6 <<<"$ver_full")"
          {
            echo "package: $pkgver"
            echo "libpulse.so.0 known to ldconfig: ${soname:-NO}"
            echo "emulator -version (exit code $ver_rc):"; echo "$ver_out"
          } | ann notice "libpulse and emulator check"
          [ -n "$soname" ] || stop "libpulse.so.0 is not available after installing libpulse0"
          if ! grep -q '^Android emulator version' <<<"$ver_out" || grep -q 'error while loading' <<<"$ver_out"; then stop "emulator -version did not succeed (exit code $ver_rc)"; fi
          echo "libpulse0 installed; emulator -version works"

      - name: Boot the emulator and run the device checks
        run: |
          set -uo pipefail
          set +e   # the runner starts steps with bash -e; every failure in this step is handled explicitly and still exits non-zero
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          export ADB="$SDK/platform-tools/adb"
          RES="$RUNNER_TEMP/o4-spike-results.txt"
          export RESULTS_FILE="$RES"
          ELOG="$RUNNER_TEMP/emulator.log"
          # Put the virtual device in an explicit folder. avdmanager and the emulator both read ANDROID_AVD_HOME first,
          # so they cannot disagree about where it is. (The first runs showed the emulator found nothing in ~/.android/avd.)
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd-home"
          mkdir -p "$ANDROID_AVD_HOME"
          TRIES="${O4_BOOT_TRIES:-120}"   # 120 x 5 s = 10 minutes
          # Diagnostics are bounded and contain no app storage, saves, keys or credentials: runner/emulator facts and the
          # emulator's own startup log. Everything goes out as annotations (step logs cannot be read without a download).
          ann() { # level title ; message on stdin
            local m; m="$(head -c 3500 | tr -d '\r' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            echo "::$1 title=$2::$m"
          }
          diagnose() { # reason
            {
              echo "reason: $1"
              echo "runner: ${ImageOS:-?} ${ImageVersion:-?}; cpus=$(nproc 2>&1); mem_mb=$(free -m 2>&1 | awk '/Mem:/{print $2}'); disk_free=$(df -h / 2>&1 | awk 'NR==2{print $4}')"
              ls -l /dev/kvm 2>&1; echo "user=$(id -un 2>&1) groups=$(id -Gn 2>&1)"
              ls -l "$SDK/emulator/emulator" 2>&1
            } | ann notice "emulator diag 1: runner"
            { timeout 30 "$SDK/emulator/emulator" -version 2>&1 | head -n 6; } | ann notice "emulator diag 2: emulator version"
            { timeout 60 "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>&1 | grep -E 'emulator|system-images|platform-tools|Path' | head -n 12
              grep -E '^(Pkg\.Desc|Pkg\.Revision|SystemImage\.)' "$SDK/system-images/android-34/default/x86_64/source.properties" 2>&1 | head -n 8
              grep -E '^(abi\.type|image\.sysdir\.1|hw\.cpu\.arch|hw\.ramSize|hw\.gpu\.(enabled|mode)|AvdId|tag\.id)' "$ANDROID_AVD_HOME/o4.avd/config.ini" 2>&1 | head -n 10
            } | ann notice "emulator diag 3: system image and AVD"
            { echo "--- first 25 lines"; head -n 25 "$ELOG" 2>&1 | cut -c1-300; } | ann notice "emulator diag 4: log head"
            { echo "--- last 40 lines"; tail -n 40 "$ELOG" 2>&1 | cut -c1-300; } | ann notice "emulator diag 5: log tail"
            { echo "processes:"; pgrep -fa 'qemu-system|emulator' 2>&1 | cut -c1-200 | head -n 6
              echo "adb devices:"; timeout 20 "$ADB" devices -l 2>&1 | head -n 6
              echo "boot_completed: $(timeout 20 "$ADB" shell getprop sys.boot_completed 2>&1 | tr -d '\r')"
            } | ann notice "emulator diag 6: processes and adb"
          }
          printf 'no\n' | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd --force -n o4 -k "system-images;android-34;default;x86_64" --device pixel_6 > "$RUNNER_TEMP/avd.log" 2>&1
          avd_rc=${PIPESTATUS[1]}
          avd_listed="$(timeout 30 "$SDK/emulator/emulator" -list-avds 2>&1 | head -n 10)"
          {
            echo "avdmanager exit code: $avd_rc"
            env | grep '^ANDROID_' | sed 's/^/env /'
            echo "AVD folder: $ANDROID_AVD_HOME"; ls -la "$ANDROID_AVD_HOME" 2>&1 | head -n 12
            echo "emulator -list-avds: ${avd_listed:-<empty>}"
            echo "--- avdmanager output (last 15 lines)"; tail -n 15 "$RUNNER_TEMP/avd.log" | cut -c1-300
          } | ann notice "AVD creation"
          if [ "$avd_rc" -ne 0 ] || [ ! -f "$ANDROID_AVD_HOME/o4.ini" ] || [ ! -f "$ANDROID_AVD_HOME/o4.avd/config.ini" ] || ! grep -qx o4 <<<"$avd_listed"; then
            where="$(find "$HOME" "$RUNNER_TEMP" -maxdepth 5 -name 'o4.ini' 2>/dev/null | head -n 5 | paste -sd ' ' -)"
            reason="the virtual device o4 was not created and found in $ANDROID_AVD_HOME (avdmanager exit code $avd_rc; o4.ini found elsewhere at: ${where:-nowhere})"
            echo "FAIL E0: $reason" > "$RES"
            diagnose "$reason"
            exit 1
          fi
          setsid nohup "$SDK/emulator/emulator" -avd o4 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on -memory 3072 > "$ELOG" 2>&1 &
          emu_pid=$!
          stop_emulator() { "$ADB" emu kill >/dev/null 2>&1 || true; kill "$emu_pid" >/dev/null 2>&1 || true; }
          trap stop_emulator EXIT
          "$ADB" start-server >/dev/null 2>&1
          booted=no; exited=no; started=$SECONDS
          for _ in $(seq 1 "$TRIES"); do
            if ! kill -0 "$emu_pid" 2>/dev/null; then exited=yes; break; fi
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then booted=yes; break; fi
            sleep 5
          done
          waited=$((SECONDS - started))
          if [ "$booted" != yes ]; then
            if [ "$exited" = yes ]; then
              wait "$emu_pid" 2>/dev/null; emu_rc=$?
              sleep 15   # observation only: is an emulator process still alive after the tracked process exited?
              reason="the tracked emulator process exited after about ${waited}s with exit code ${emu_rc} (wait status; 127 means unavailable)"
              echo "FAIL E0: $reason" > "$RES"
            else
              reason="the emulator process was still running but sys.boot_completed was not 1 after ${waited}s (limit $((TRIES * 5))s)"
              echo "FAIL E0: $reason" > "$RES"
            fi
            diagnose "$reason"
            exit 1
          fi
          echo "emulator booted after about ${waited}s"
          "$ADB" version | head -n 1
          bash "$RUNNER_TEMP/device-checks.sh"
          dc_rc=$?
          if [ "$dc_rc" -ne 0 ]; then echo "Stage 2 device checks failed (exit code $dc_rc); Stage 3 is not run."; exit "$dc_rc"; fi
          bash "$RUNNER_TEMP/launch-observe.sh"
          exit $?

      - name: Report the results
        if: always()
        run: |
          set -u
          RES="$RUNNER_TEMP/o4-spike-results.txt"
          if [ ! -s "$RES" ]; then
            echo "::error title=No device results::The device checks never produced results (an earlier step failed before the emulator was ready)."
            body="No device results were produced."
          else
            body="$(cat "$RES")"
            s2="$(grep -vE '^[A-Z]+ X[0-9]' "$RES")"; s3="$(grep -E '^[A-Z]+ X[0-9]|^RESULT STAGE3' "$RES")"
            echo "::notice title=O4 Stage 2 results::${s2//$'\n'/%0A}"
            if [ -n "$s3" ]; then echo "::notice title=O4 Stage 3 launch results::${s3//$'\n'/%0A}"; fi
          fi
          {
            echo "### O4 emulator spike (feasibility only)"
            echo
            echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}. System image: android-34 default x86_64."
            echo
            echo '```'
            echo "$body"
            echo '```'
            echo
            echo "**Not demonstrated by this run (the app is launched but no input is sent, no choice is committed, and no"
            echo "save data is created or read):** checkpoint stamp validity or rejection, lineage correctness, stale-history"
            echo "rejection, interrupted-write recovery, gameplay. A launched app with no saves proves none of these."
          } >> "$GITHUB_STEP_SUMMARY"
